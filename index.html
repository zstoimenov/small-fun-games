<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Game Box — Small Fun Games</title>
<meta name="description" content="A little box of fun games. Tap one to play!">
<meta name="theme-color" content="#6c4cf0">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Box">
<style>
  :root{
    --bg1:#f3f0ff; --bg2:#e7f6ff; --ink:#20264a; --muted:#5a6690;
    --card:#ffffff; --cardline:#e7e3ff; --shadow:rgba(60,40,140,.16);
    --chip:#f0edff; --chipink:#5b4bd0;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg1:#12132a; --bg2:#0d1a26; --ink:#eef1ff; --muted:#9aa4cf;
      --card:#1a1d38; --cardline:#2c2f56; --shadow:rgba(0,0,0,.5);
      --chip:#242861; --chipink:#c7cdff; }
  }
  :root[data-theme="dark"]{ --bg1:#12132a; --bg2:#0d1a26; --ink:#eef1ff; --muted:#9aa4cf;
    --card:#1a1d38; --cardline:#2c2f56; --shadow:rgba(0,0,0,.5); --chip:#242861; --chipink:#c7cdff; }
  :root[data-theme="light"]{ --bg1:#f3f0ff; --bg2:#e7f6ff; --ink:#20264a; --muted:#5a6690;
    --card:#ffffff; --cardline:#e7e3ff; --shadow:rgba(60,40,140,.16); --chip:#f0edff; --chipink:#5b4bd0; }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;min-height:100dvh;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--bg2), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    -webkit-text-size-adjust:100%;
    padding:max(18px,env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
    touch-action:manipulation;
  }
  .wrap{max-width:940px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;margin:10px 4px 6px}
  /* Filter bar: sticks to the top and bleeds to the screen edges so each row of
     pills can scroll sideways on a phone without a ragged cut-off. */
  .filterbar{
    position:sticky;top:max(0px,env(safe-area-inset-top));z-index:5;
    margin:16px -18px 0;padding:11px 0;
    background:color-mix(in srgb, var(--bg1) 82%, transparent);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  .filters{
    display:flex;gap:9px;padding:2px 18px;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .filters::-webkit-scrollbar{display:none}
  .filters + .filters{margin-top:8px}
  .filter{
    flex:0 0 auto;font:inherit;font-size:14px;font-weight:700;
    padding:10px 16px;border-radius:999px;cursor:pointer;
    background:var(--card);color:var(--muted);
    border:1px solid var(--cardline);
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease, opacity .12s ease;
  }
  .filter:active{transform:scale(.94)}
  .filter[aria-pressed="true"]{
    background:var(--chip);color:var(--chipink);border-color:var(--chipink);
  }
  /* A pick that would empty the grid is dimmed rather than removed, so the row
     keeps its shape as you tap around. */
  .filter:disabled{opacity:.35;cursor:default}
  .filter:disabled:active{transform:none}
  .filter .count{opacity:.6;font-weight:600;margin-left:5px}
  /* Second row (players) reads as a refinement of the first, not a rival to it. */
  .filters.secondary .filter{font-size:13px;padding:8px 14px;border-style:dashed}
  .filters.secondary .filter[aria-pressed="true"]{border-style:solid}
  .logo{
    width:60px;height:60px;flex:0 0 auto;border-radius:18px;
    display:grid;place-items:center;font-size:34px;
    background:linear-gradient(145deg,#7b5cff,#4bc8ff);
    box-shadow:0 8px 20px var(--shadow);
  }
  h1{margin:0;font-size:clamp(24px,5vw,34px);letter-spacing:-.5px}
  .tag{margin:2px 0 0;color:var(--muted);font-size:14px}
  .grid{
    display:grid;gap:18px;margin-top:18px;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  }
  .card{
    position:relative;display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--cardline);border-radius:20px;
    text-decoration:none;color:inherit;overflow:hidden;
    box-shadow:0 10px 26px var(--shadow);
    transition:transform .12s ease, box-shadow .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  /* `display:flex` above would otherwise beat the UA stylesheet's [hidden] rule. */
  .card[hidden]{display:none}
  .card:active{transform:scale(.975)}
  @media (hover:hover){ .card:hover{transform:translateY(-4px);box-shadow:0 16px 34px var(--shadow)} }
  .thumb{
    height:150px;display:grid;place-items:center;position:relative;overflow:hidden;
  }
  .thumb .emoji{font-size:74px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.22));z-index:1}
  .thumb .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55}
  .body{padding:15px 17px 17px}
  .body h2{margin:0 0 5px;font-size:20px}
  .body p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{
    font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;
    background:var(--chip);color:var(--chipink);
  }
  .play{
    position:absolute;top:12px;right:12px;z-index:2;
    font-weight:800;font-size:13px;color:#fff;
    padding:8px 15px;border-radius:999px;
    background:rgba(15,18,40,.42);
    border:1px solid rgba(255,255,255,.45);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
  .new{
    position:absolute;top:12px;left:12px;z-index:2;
    font-weight:800;font-size:12px;letter-spacing:.6px;color:#20264a;
    padding:6px 12px;border-radius:999px;background:#ffe600;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
  .empty{margin:30px 6px;color:var(--muted);text-align:center}
  footer{margin:30px 6px 0;color:var(--muted);font-size:13px;text-align:center;line-height:1.6}
  .install{display:none}
  .install.show{display:inline-block;margin-top:10px;cursor:pointer;
    background:var(--chip);color:var(--chipink);border:none;font:inherit;font-weight:700;
    padding:10px 18px;border-radius:999px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎮</div>
    <div>
      <h1>Game Box</h1>
      <p class="tag">A little box of fun games — tap one to play!</p>
    </div>
  </header>

  <div class="filterbar" id="filterbar"></div>

  <main class="grid" id="grid" aria-label="Game catalogue"></main>
  <p class="empty" id="empty" hidden>No games match both picks — try another.</p>

  <footer>
    <button class="install" id="installBtn">⬇️ Install Game Box</button>
  </footer>
</div>

<script>
// ---- The shelves. A game's `category` has to be one of these ids. ----
// Add a category here and the filter bar picks it up automatically; it only
// shows up once at least one game uses it.
const CATEGORIES = [
  { id: "board",  label: "Board & Strategy", emoji: "♟️" },
  { id: "coding", label: "Coding",           emoji: "🧠" },
  { id: "puzzle", label: "Puzzles",          emoji: "🧩" },
  { id: "maths",  label: "Maths",            emoji: "🔢" },
  { id: "sport",  label: "Sport",            emoji: "⚽" }
];

// ---- The catalogue. Add a new game = add one entry here. ----
// "added" is the date the game was published; the list is sorted by it below,
// newest first, so a new entry lands at the top wherever you paste it.
// The chips on each card are generated from `category`, `players`, `age` and
// `highlights` — don't hand-write them, or they drift from the real thing.
const GAMES = [
  {
    title: "Deal or No Deal",
    folder: "deal-or-no-deal",
    emoji: "💼",
    added: "2026-08-03",
    category: "board",
    players: [1, 3],
    age: 7,
    blurb: "Keep one sealed box back, then open the others one by one. Every few boxes the Banker rings up and offers to buy yours — take the money, or find out what's inside. 1–3 players, or beat a robot contestant.",
    colors: ["#c8a021", "#b8121f"],
    highlights: ["☎️ The Banker", "💰 Big money"]
  },
  {
    title: "Lemonade Stand",
    folder: "lemonade-stand",
    emoji: "🍋",
    added: "2026-08-03",
    category: "maths",
    players: [1, 1],
    age: 8,
    blurb: "Run a lemonade stall for a fortnight. Buy your cups, pick a price, and count out people's change when they pay with a note. Money in the bank grows overnight; money you borrow costs you more than you took. Some days go wrong. Saving up for the bike takes a really good fortnight.",
    colors: ["#ffd23d", "#2f9e5a"],
    highlights: ["🪙 Counting change", "🏦 Saving & borrowing"]
  },
  {
    title: "Battleship",
    folder: "battleship",
    emoji: "🚢",
    added: "2026-07-31",
    category: "board",
    players: [1, 2],
    age: 6,
    blurb: "Hide your ships in the sea, then call out squares until you've found all of theirs. Play a friend on one tablet — it clears the screen in between so nobody peeks — or take on a computer that works out where a ship could still be hiding.",
    colors: ["#1f7ae0", "#12a3bd"],
    highlights: ["🙈 Hidden fleets", "🧠 Thinks ahead"]
  },
  {
    title: "Mastermind",
    folder: "mastermind",
    emoji: "🎯",
    added: "2026-07-30",
    category: "puzzle",
    players: [1, 2],
    age: 6,
    blurb: "Somebody hides a row of colours. Work it out from the pegs — black for a colour in the right place, white for one in the wrong place. Crack the computer's code, or hide one and watch it think.",
    colors: ["#8b5ae8", "#c04bb0"],
    highlights: ["🕵️ Code breaking", "💡 Hints"]
  },
  {
    title: "Nine Men's Morris",
    folder: "nine-mens-morris",
    emoji: "⚫",
    added: "2026-07-30",
    category: "board",
    players: [1, 2],
    age: 7,
    blurb: "Also called Дама. Put your nine pieces out, line three of them up, and take one of theirs every time you do. Last one with three pieces loses.",
    colors: ["#d8a55f", "#8a5a1f"],
    highlights: ["🧠 Thinks ahead", "🎉 Lines of three"]
  },
  {
    title: "Connect Four",
    folder: "connect-four",
    emoji: "🔴",
    added: "2026-07-29",
    category: "board",
    players: [1, 2],
    blurb: "Drop your discs and line up four — across, up or slanting. Play a friend on one screen, or take on a computer that really does think ahead.",
    colors: ["#5b93ff", "#1f3fa8"],
    highlights: ["🧠 Thinks ahead", "💡 Hints"]
  },
  {
    title: "Yatzy Dice",
    folder: "yatzy-dice",
    emoji: "🎲",
    added: "2026-07-28",
    category: "board",
    players: [1, 3],
    blurb: "Roll five dice, chase full houses and straights. Play 1–3 players, take on the computer, or use it as a scorecard for your real dice.",
    colors: ["#f45b69", "#6c4cf0"],
    highlights: ["🎲 Dice", "📝 Scorecard mode"]
  },
  {
    title: "Footy Tactics Lab",
    folder: "footy-tactics-lab",
    emoji: "🥅",
    added: "2026-07-25",
    category: "coding",
    players: [1, 1],
    age: 8,
    blurb: "Learn to code with footy. Snap together move, turn and repeat blocks, then watch your play run one step at a time — and debug it when it goes wrong.",
    colors: ["#ffc23d", "#0e6b3a"],
    highlights: ["🔁 Loops", "🥅 Footy"]
  },
  {
    title: "Times Table Blaster",
    folder: "times-table-blaster",
    emoji: "⭐",
    added: "2026-07-23",
    category: "maths",
    players: [1, 1],
    blurb: "Blast through your times tables! Earn ninja belts one table at a time, or take on Classic mode with timers and streaks.",
    colors: ["#ff4da6", "#ffe600"],
    highlights: ["🥷 Belts", "⏱️ Timed mode"]
  },
  {
    title: "Robo Rules",
    folder: "robo-rules",
    emoji: "🤖",
    added: "2026-07-23",
    category: "coding",
    players: [1, 1],
    age: 7,
    blurb: "Teach Chip the robot pet using IF-THIS-THEN-THAT rules. A first, playful taste of coding.",
    colors: ["#4fc3f7", "#8a7bff"],
    highlights: ["🔀 If-then rules"]
  },
  {
    title: "AFL Goal Kick",
    folder: "afl-goal-kick",
    emoji: "🏉",
    added: "2026-07-23",
    category: "sport",
    players: [1, 2],
    blurb: "Aim the arrow, load the power bar, time your run-up and thread the big sticks. Wind, a man on the mark, and 3 difficulty levels.",
    colors: ["#3ddc68", "#2f9d4d"],
    highlights: ["💨 Wind", "🎚️ 3 levels"]
  }
];

// The "NEW" ribbon: only the freshest couple of games, and only for a month.
// Games tend to land in batches, and a shelf where every card shouts NEW says
// nothing — hence the cap as well as the time limit.
const NEW_FOR_DAYS = 30;
const MAX_NEW = 2;

const catById = new Map(CATEGORIES.map(c => [c.id, c]));

// Newest first. Sort is stable, so games published the same day keep the order
// they're written in above.
const shelf = GAMES.slice().sort((a, b) => (b.added || "").localeCompare(a.added || ""));

function playersLabel([lo, hi]) {
  if (lo === hi) return lo === 1 ? "👤 1 player" : `👥 ${lo} players`;
  return `👥 ${lo}–${hi} players`;
}

function chipsFor(g) {
  const cat = catById.get(g.category);
  const chips = [];
  if (cat) chips.push(`${cat.emoji} ${cat.label}`);
  if (g.players) chips.push(playersLabel(g.players));
  if (g.age) chips.push(`🎯 Age ${g.age}+`);
  return chips.concat(g.highlights || []);
}

// `shelf` is already newest-first, so the candidates are just the top few.
const freshlyAdded = new Set(
  shelf.slice(0, MAX_NEW)
    .filter(g => {
      const days = (Date.now() - Date.parse(g.added)) / 86400000;
      return days >= 0 && days < NEW_FOR_DAYS;
    })
    .map(g => g.folder)
);

// ---- Cards ----
const grid = document.getElementById("grid");
const emptyNote = document.getElementById("empty");
const cards = shelf.map(g => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = "./" + g.folder + "/";
  a.dataset.category = g.category || "";
  a.innerHTML = `
    <span class="play">▶ Play</span>
    ${freshlyAdded.has(g.folder) ? '<span class="new">NEW</span>' : ""}
    <div class="thumb" style="background:linear-gradient(145deg, ${g.colors[0]}, ${g.colors[1]})">
      <div class="blob" style="width:120px;height:120px;background:rgba(255,255,255,.35);top:-30px;left:-20px"></div>
      <div class="blob" style="width:90px;height:90px;background:rgba(0,0,0,.10);bottom:-24px;right:-10px"></div>
      <div class="emoji">${g.emoji}</div>
    </div>
    <div class="body">
      <h2>${g.title}</h2>
      <p>${g.blurb}</p>
      <div class="chips">${chipsFor(g).map(c => `<span class="chip">${c}</span>`).join("")}</div>
    </div>`;
  grid.appendChild(a);
  return a;
});

// ---- Filter bar ----
// Two rows of pills, each row one "group". A game has to match the pick in
// *every* group to show, so you can ask for coding games you can play with a
// friend. Each group's first option is the reset, and always matches.
//
// Player picks test against the [min, max] range, not a fixed number — Yatzy is
// a 1–3 player game, so it belongs under "on my own" and "with a friend" alike.
const FILTER_GROUPS = [
  {
    id: "cat",
    label: "Filter games by category",
    options: [{ id: "all", label: "All", emoji: "🎮", match: () => true }].concat(
      CATEGORIES.map(c => Object.assign({}, c, { match: g => g.category === c.id }))
    )
  },
  {
    id: "players",
    label: "Filter games by number of players",
    secondary: true,
    options: [
      { id: "any",   label: "Any players",   emoji: "🙋", match: () => true },
      { id: "solo",  label: "On my own",     emoji: "👤", match: g => g.players[0] <= 1 },
      { id: "duo",   label: "With a friend", emoji: "👥", match: g => g.players[0] <= 2 && g.players[1] >= 2 },
      { id: "party", label: "3 or more",     emoji: "👨‍👩‍👦", match: g => g.players[1] >= 3 }
    ]
  }
];

// Drop options nothing in the catalogue can ever satisfy, so the bar doesn't
// fill up with empty shelves. The reset option always survives.
for (const group of FILTER_GROUPS) {
  group.options = group.options.filter((o, i) => i === 0 || shelf.some(o.match));
}

const state = {};
for (const group of FILTER_GROUPS) state[group.id] = group.options[0].id;

const optionIn = (group, id) =>
  group.options.find(o => o.id === id) || group.options[0];

// A game passes when every group agrees. `except` leaves one group out, which
// is how each pill works out the count it would leave behind.
function passes(game, except) {
  return FILTER_GROUPS.every(gr =>
    gr.id === except || optionIn(gr, state[gr.id]).match(game));
}

// ---- Reading and writing the picks ----
// The hash carries both groups (#cat=coding&players=duo). A bare "#coding" is
// still understood, so links made before the players row existed keep working.
const STORE_KEY = "gamebox:filters";

function readPicks() {
  const raw = location.hash.replace("#", "");
  let source = null;
  if (raw && !raw.includes("=")) {
    source = new URLSearchParams("cat=" + raw);
  } else if (raw) {
    source = new URLSearchParams(raw);
  } else {
    try { source = new URLSearchParams(localStorage.getItem(STORE_KEY) || ""); }
    catch (e) { /* private mode — fall through to the defaults */ }
  }
  for (const group of FILTER_GROUPS) {
    const wanted = source && source.get(group.id);
    // optionIn falls back to the reset, so a stale or hand-typed id can never
    // strand you on an empty grid.
    state[group.id] = optionIn(group, wanted).id;
  }
}

function serialise() {
  const params = new URLSearchParams();
  for (const group of FILTER_GROUPS) {
    if (state[group.id] !== group.options[0].id) params.set(group.id, state[group.id]);
  }
  return params.toString();
}

// ---- Build the rows ----
const filterbar = document.getElementById("filterbar");
const pills = [];
for (const group of FILTER_GROUPS) {
  const row = document.createElement("div");
  row.className = "filters" + (group.secondary ? " secondary" : "");
  row.setAttribute("role", "group");
  row.setAttribute("aria-label", group.label);
  for (const opt of group.options) {
    const b = document.createElement("button");
    b.className = "filter";
    b.type = "button";
    b.innerHTML = `${opt.emoji} ${opt.label}<span class="count"></span>`;
    b.addEventListener("click", () => {
      state[group.id] = opt.id;
      apply();
    });
    row.appendChild(b);
    pills.push({ button: b, group, opt });
  }
  filterbar.appendChild(row);
}

function apply(remember = true) {
  let shown = 0;
  cards.forEach((card, i) => {
    const match = passes(shelf[i]);
    card.hidden = !match;
    if (match) shown++;
  });
  emptyNote.hidden = shown > 0;

  for (const { button, group, opt } of pills) {
    const selected = state[group.id] === opt.id;
    // Counts are live: each pill shows what you'd get if you tapped it *now*,
    // with the other row's pick still applied. A pill that would empty the grid
    // is disabled rather than hidden, so the row doesn't jump around.
    const count = shelf.filter(g => opt.match(g) && passes(g, group.id)).length;
    button.setAttribute("aria-pressed", String(selected));
    button.querySelector(".count").textContent = count;
    button.disabled = count === 0 && !selected;
  }

  if (!remember) return;
  const query = serialise();
  try { localStorage.setItem(STORE_KEY, query); } catch (e) { /* ignore */ }
  // replaceState keeps the picks bookmarkable without pushing history entries
  // or jumping the page to a #target.
  history.replaceState(null, "", query ? "#" + query : location.pathname);
}

readPicks();
apply(false);
addEventListener("hashchange", () => { readPicks(); apply(false); });

// ---- PWA install prompt (Android/Chrome) ----
let deferredPrompt = null;
const installBtn = document.getElementById("installBtn");
addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); deferredPrompt = e; installBtn.classList.add("show");
});
installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null; installBtn.classList.remove("show");
});
addEventListener("appinstalled", () => installBtn.classList.remove("show"));

if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
