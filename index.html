<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Game Box — Small Fun Games</title>
<meta name="description" content="A little box of fun games. Tap one to play!">
<meta name="theme-color" content="#6c4cf0">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Box">
<style>
  :root{
    --bg1:#f3f0ff; --bg2:#e7f6ff; --ink:#20264a; --muted:#5a6690;
    --card:#ffffff; --cardline:#e7e3ff; --shadow:rgba(60,40,140,.16);
    --chip:#f0edff; --chipink:#5b4bd0;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg1:#12132a; --bg2:#0d1a26; --ink:#eef1ff; --muted:#9aa4cf;
      --card:#1a1d38; --cardline:#2c2f56; --shadow:rgba(0,0,0,.5);
      --chip:#242861; --chipink:#c7cdff; }
  }
  :root[data-theme="dark"]{ --bg1:#12132a; --bg2:#0d1a26; --ink:#eef1ff; --muted:#9aa4cf;
    --card:#1a1d38; --cardline:#2c2f56; --shadow:rgba(0,0,0,.5); --chip:#242861; --chipink:#c7cdff; }
  :root[data-theme="light"]{ --bg1:#f3f0ff; --bg2:#e7f6ff; --ink:#20264a; --muted:#5a6690;
    --card:#ffffff; --cardline:#e7e3ff; --shadow:rgba(60,40,140,.16); --chip:#f0edff; --chipink:#5b4bd0; }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;min-height:100dvh;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--bg2), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    -webkit-text-size-adjust:100%;
    padding:max(18px,env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
    touch-action:manipulation;
  }
  .wrap{max-width:940px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;margin:10px 4px 6px}
  /* Filter bar: sticks to the top and bleeds to the screen edges so the pills
     can scroll sideways on a phone without a ragged cut-off. */
  .filters{
    position:sticky;top:max(0px,env(safe-area-inset-top));z-index:5;
    margin:16px -18px 0;padding:12px 18px;
    display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    background:color-mix(in srgb, var(--bg1) 82%, transparent);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  .filters::-webkit-scrollbar{display:none}
  .filter{
    flex:0 0 auto;font:inherit;font-size:14px;font-weight:700;
    padding:10px 16px;border-radius:999px;cursor:pointer;
    background:var(--card);color:var(--muted);
    border:1px solid var(--cardline);
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease;
  }
  .filter:active{transform:scale(.94)}
  .filter[aria-pressed="true"]{
    background:var(--chip);color:var(--chipink);border-color:var(--chipink);
  }
  .filter .count{opacity:.6;font-weight:600;margin-left:5px}
  .logo{
    width:60px;height:60px;flex:0 0 auto;border-radius:18px;
    display:grid;place-items:center;font-size:34px;
    background:linear-gradient(145deg,#7b5cff,#4bc8ff);
    box-shadow:0 8px 20px var(--shadow);
  }
  h1{margin:0;font-size:clamp(24px,5vw,34px);letter-spacing:-.5px}
  .tag{margin:2px 0 0;color:var(--muted);font-size:14px}
  .grid{
    display:grid;gap:18px;margin-top:18px;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  }
  .card{
    position:relative;display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--cardline);border-radius:20px;
    text-decoration:none;color:inherit;overflow:hidden;
    box-shadow:0 10px 26px var(--shadow);
    transition:transform .12s ease, box-shadow .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  /* `display:flex` above would otherwise beat the UA stylesheet's [hidden] rule. */
  .card[hidden]{display:none}
  .card:active{transform:scale(.975)}
  @media (hover:hover){ .card:hover{transform:translateY(-4px);box-shadow:0 16px 34px var(--shadow)} }
  .thumb{
    height:150px;display:grid;place-items:center;position:relative;overflow:hidden;
  }
  .thumb .emoji{font-size:74px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.22));z-index:1}
  .thumb .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55}
  .body{padding:15px 17px 17px}
  .body h2{margin:0 0 5px;font-size:20px}
  .body p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{
    font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;
    background:var(--chip);color:var(--chipink);
  }
  .play{
    position:absolute;top:12px;right:12px;z-index:2;
    font-weight:800;font-size:13px;color:#fff;
    padding:8px 15px;border-radius:999px;
    background:rgba(15,18,40,.42);
    border:1px solid rgba(255,255,255,.45);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
  .new{
    position:absolute;top:12px;left:12px;z-index:2;
    font-weight:800;font-size:12px;letter-spacing:.6px;color:#20264a;
    padding:6px 12px;border-radius:999px;background:#ffe600;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
  .empty{margin:30px 6px;color:var(--muted);text-align:center}
  footer{margin:30px 6px 0;color:var(--muted);font-size:13px;text-align:center;line-height:1.6}
  .install{display:none}
  .install.show{display:inline-block;margin-top:10px;cursor:pointer;
    background:var(--chip);color:var(--chipink);border:none;font:inherit;font-weight:700;
    padding:10px 18px;border-radius:999px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎮</div>
    <div>
      <h1>Game Box</h1>
      <p class="tag">A little box of fun games — tap one to play!</p>
    </div>
  </header>

  <div class="filters" id="filters" role="group" aria-label="Filter games by category"></div>

  <main class="grid" id="grid" aria-label="Game catalogue"></main>
  <p class="empty" id="empty" hidden>Nothing here yet — try another category.</p>

  <footer>
    <button class="install" id="installBtn">⬇️ Install Game Box</button>
  </footer>
</div>

<script>
// ---- The shelves. A game's `category` has to be one of these ids. ----
// Add a category here and the filter bar picks it up automatically; it only
// shows up once at least one game uses it.
const CATEGORIES = [
  { id: "board",  label: "Board & Strategy", emoji: "♟️" },
  { id: "coding", label: "Coding",           emoji: "🧠" },
  { id: "puzzle", label: "Puzzles",          emoji: "🧩" },
  { id: "maths",  label: "Maths",            emoji: "🔢" },
  { id: "sport",  label: "Sport",            emoji: "⚽" }
];

// ---- The catalogue. Add a new game = add one entry here. ----
// "added" is the date the game was published; the list is sorted by it below,
// newest first, so a new entry lands at the top wherever you paste it.
// The chips on each card are generated from `category`, `players`, `age` and
// `highlights` — don't hand-write them, or they drift from the real thing.
const GAMES = [
  {
    title: "Yatzy Dice",
    folder: "yatzy-dice",
    emoji: "🎲",
    added: "2026-07-28",
    category: "board",
    players: "1–3",
    blurb: "Roll five dice, chase full houses and straights. Play 1–3 players, take on the computer, or use it as a scorecard for your real dice.",
    colors: ["#f45b69", "#6c4cf0"],
    highlights: ["🎲 Dice", "📝 Scorecard mode"]
  },
  {
    title: "Footy Tactics Lab",
    folder: "footy-tactics-lab",
    emoji: "🥅",
    added: "2026-07-25",
    category: "coding",
    players: "1",
    age: 8,
    blurb: "Learn to code with footy. Snap together move, turn and repeat blocks, then watch your play run one step at a time — and debug it when it goes wrong.",
    colors: ["#ffc23d", "#0e6b3a"],
    highlights: ["🔁 Loops", "🥅 Footy"]
  },
  {
    title: "Times Table Blaster",
    folder: "times-table-blaster",
    emoji: "⭐",
    added: "2026-07-23",
    category: "maths",
    players: "1",
    blurb: "Blast through your times tables! Earn ninja belts one table at a time, or take on Classic mode with timers and streaks.",
    colors: ["#ff4da6", "#ffe600"],
    highlights: ["🥷 Belts", "⏱️ Timed mode"]
  },
  {
    title: "Robo Rules",
    folder: "robo-rules",
    emoji: "🤖",
    added: "2026-07-23",
    category: "coding",
    players: "1",
    age: 7,
    blurb: "Teach Chip the robot pet using IF-THIS-THEN-THAT rules. A first, playful taste of coding.",
    colors: ["#4fc3f7", "#8a7bff"],
    highlights: ["🔀 If-then rules"]
  },
  {
    title: "AFL Goal Kick",
    folder: "afl-goal-kick",
    emoji: "🏉",
    added: "2026-07-23",
    category: "sport",
    players: "1–2",
    blurb: "Aim the arrow, load the power bar, time your run-up and thread the big sticks. Wind, a man on the mark, and 3 difficulty levels.",
    colors: ["#3ddc68", "#2f9d4d"],
    highlights: ["💨 Wind", "🎚️ 3 levels"]
  }
];

// The "NEW" ribbon: only the freshest couple of games, and only for a month.
// Games tend to land in batches, and a shelf where every card shouts NEW says
// nothing — hence the cap as well as the time limit.
const NEW_FOR_DAYS = 30;
const MAX_NEW = 2;

const catById = new Map(CATEGORIES.map(c => [c.id, c]));

// Newest first. Sort is stable, so games published the same day keep the order
// they're written in above.
const shelf = GAMES.slice().sort((a, b) => (b.added || "").localeCompare(a.added || ""));

function chipsFor(g) {
  const cat = catById.get(g.category);
  const chips = [];
  if (cat) chips.push(`${cat.emoji} ${cat.label}`);
  if (g.players) chips.push(g.players === "1" ? "👤 1 player" : `👥 ${g.players} players`);
  if (g.age) chips.push(`🎯 Age ${g.age}+`);
  return chips.concat(g.highlights || []);
}

// `shelf` is already newest-first, so the candidates are just the top few.
const freshlyAdded = new Set(
  shelf.slice(0, MAX_NEW)
    .filter(g => {
      const days = (Date.now() - Date.parse(g.added)) / 86400000;
      return days >= 0 && days < NEW_FOR_DAYS;
    })
    .map(g => g.folder)
);

// ---- Cards ----
const grid = document.getElementById("grid");
const emptyNote = document.getElementById("empty");
const cards = shelf.map(g => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = "./" + g.folder + "/";
  a.dataset.category = g.category || "";
  a.innerHTML = `
    <span class="play">▶ Play</span>
    ${freshlyAdded.has(g.folder) ? '<span class="new">NEW</span>' : ""}
    <div class="thumb" style="background:linear-gradient(145deg, ${g.colors[0]}, ${g.colors[1]})">
      <div class="blob" style="width:120px;height:120px;background:rgba(255,255,255,.35);top:-30px;left:-20px"></div>
      <div class="blob" style="width:90px;height:90px;background:rgba(0,0,0,.10);bottom:-24px;right:-10px"></div>
      <div class="emoji">${g.emoji}</div>
    </div>
    <div class="body">
      <h2>${g.title}</h2>
      <p>${g.blurb}</p>
      <div class="chips">${chipsFor(g).map(c => `<span class="chip">${c}</span>`).join("")}</div>
    </div>`;
  grid.appendChild(a);
  return a;
});

// ---- Filter bar ----
// Only categories that actually have games get a pill, so the bar can't fill up
// with empty shelves.
const shelves = [{ id: "all", label: "All", emoji: "🎮", count: shelf.length }]
  .concat(CATEGORIES
    .map(c => Object.assign({}, c, { count: shelf.filter(g => g.category === c.id).length }))
    .filter(c => c.count > 0));

const validId = id => shelves.some(s => s.id === id);
const STORE_KEY = "gamebox:filter";

function readInitialFilter() {
  const fromHash = decodeURIComponent(location.hash.replace("#", ""));
  if (validId(fromHash)) return fromHash;
  try {
    const saved = localStorage.getItem(STORE_KEY);
    if (validId(saved)) return saved;
  } catch (e) { /* private mode — just fall back to All */ }
  return "all";
}

const filters = document.getElementById("filters");
const buttons = shelves.map(s => {
  const b = document.createElement("button");
  b.className = "filter";
  b.type = "button";
  b.dataset.id = s.id;
  b.innerHTML = `${s.emoji} ${s.label}<span class="count">${s.count}</span>`;
  b.addEventListener("click", () => apply(s.id));
  filters.appendChild(b);
  return b;
});

function apply(id, remember = true) {
  for (const b of buttons) b.setAttribute("aria-pressed", String(b.dataset.id === id));
  let shown = 0;
  cards.forEach((card, i) => {
    const match = id === "all" || shelf[i].category === id;
    card.hidden = !match;
    if (match) shown++;
  });
  emptyNote.hidden = shown > 0;
  if (!remember) return;
  try { localStorage.setItem(STORE_KEY, id); } catch (e) { /* ignore */ }
  // replaceState keeps the pick bookmarkable without pushing history entries or
  // jumping the page to a #target.
  history.replaceState(null, "", id === "all" ? location.pathname : "#" + id);
}

apply(readInitialFilter(), false);
addEventListener("hashchange", () => apply(readInitialFilter(), false));

// ---- PWA install prompt (Android/Chrome) ----
let deferredPrompt = null;
const installBtn = document.getElementById("installBtn");
addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); deferredPrompt = e; installBtn.classList.add("show");
});
installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null; installBtn.classList.remove("show");
});
addEventListener("appinstalled", () => installBtn.classList.remove("show"));

if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
