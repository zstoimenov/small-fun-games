<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Times Table Blaster!</title>
<link rel="manifest" href="manifest.json"/>
<link rel="stylesheet" href="../shared/screen.css"/>
<meta name="theme-color" content="#080820"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TTBlaster"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
<style>
  /* Two arcades. Dark is the original neon night; light is the same arcade by
     day: the neon colours darken so they can be read on a pale background (the
     tone() helper does the same for colours made in the script), and the glows
     go, because a glow on white is only a blur. --fg is the colour every
     "white at some alpha" in the markup is drawn in. */
  :root{
    --fg:24,22,64; --bg:linear-gradient(135deg,#f6f4ff 0%,#fdeef7 50%,#eaf3ff 100%); --strip:#f8f4fd;
    /* Text drawn in --fg at a low alpha is lifted (alpha*tk + tb) so dim labels
       still read; cards drawn in --shade are lavender by day, black by night. */
    --tk:.5; --tb:.45; --shade:110,90,190;
    --yellow:#8c7e00; --cyan:#007e8c; --green:#3c8c1c; --pink:#d42c86; --red:#d23434; --purple:#8e3cd0; --orange:#c45a10;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --fg:255,255,255; --bg:linear-gradient(135deg,#080820 0%,#160430 50%,#0b1a3e 100%); --strip:#0d0d28;
    --tk:.7; --tb:.25; --shade:0,0,0;
      --tk:.7; --tb:.25; --shade:0,0,0;
      --yellow:#ffe600; --cyan:#00e5ff; --green:#7cff50; --pink:#ff4da6; --red:#ff5555; --purple:#bf5fff; --orange:#ff6b35;
    }
  }
  :root[data-theme="dark"]{
    --fg:255,255,255; --bg:linear-gradient(135deg,#080820 0%,#160430 50%,#0b1a3e 100%); --strip:#0d0d28;
    --tk:.7; --tb:.25; --shade:0,0,0;
    --yellow:#ffe600; --cyan:#00e5ff; --green:#7cff50; --pink:#ff4da6; --red:#ff5555; --purple:#bf5fff; --orange:#ff6b35;
  }
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) *{text-shadow:none !important} :root:not([data-theme="dark"]) #scanlines{opacity:.35} }
  :root[data-theme="light"] *{text-shadow:none !important}
  :root[data-theme="light"] #scanlines{opacity:.35}

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    font-family:'Courier New',monospace;
    display:flex;align-items:center;justify-content:center;
    position:relative;height:var(--app-h);
    touch-action:manipulation;
  }
  #back-to-games{
    position:fixed;top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));z-index:10000;
    display:inline-flex;align-items:center;min-height:42px;padding:0 15px;border-radius:50px;
    background:rgba(var(--fg),0.06);color:var(--cyan);text-decoration:none;
    font-family:'Courier New',monospace;font-weight:bold;font-size:0.9rem;letter-spacing:2px;
    border:1px solid color-mix(in srgb,var(--cyan) 40%,transparent);
  }
  /* A quiz has its own way out (✕ in its header), and the link would sit on it. */
  body[data-screen$="quiz"] #back-to-games{display:none}
  .quit-btn{min-width:44px;min-height:44px;border-radius:50px;border:2px solid rgba(var(--fg),0.16);background:rgba(var(--fg),0.05);color:rgba(var(--fg),calc(0.6*var(--tk) + var(--tb)));font-family:inherit;font-size:1.05rem;font-weight:bold;cursor:pointer;flex-shrink:0}
  #scanlines{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(var(--shade),0.06) 2px,rgba(var(--shade),0.06) 4px);}
  #edge-pulse{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0;transition:opacity 0.05s;}
  #edge-pulse.correct{box-shadow:inset 0 0 60px 20px rgba(124,255,80,0.22);animation:edgePulse 0.35s ease-out forwards;}
  #edge-pulse.wrong{box-shadow:inset 0 0 60px 20px rgba(255,68,68,0.25);animation:edgePulse 0.35s ease-out forwards;}
  .particle{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:9999;animation:pop 0.9s ease-out forwards;}

  /* Scrollable screens */
  #app{position:relative;z-index:2;width:100%;max-width:560px;height:100%;
    padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));}
  /* A screen is the window. The quizzes always fit; the result screens carry a
     review and a leaderboard, and only they may scroll. */
  .screen{display:none;width:100%;height:100%;overflow-y:auto;
    padding:calc(20px + env(safe-area-inset-top)) 0 calc(16px + env(safe-area-inset-bottom));animation:bounceIn 0.4s ease;}
  .screen.active{display:block;}
  #screen-ninjabelt-quiz.active,#screen-classic-quiz.active{display:flex;flex-direction:column;justify-content:center;}
  #screen-home.active{display:flex;flex-direction:column;justify-content:safe center;}
  .home-title{padding-top:28px}

  /* Wider than tall: home in two columns; a quiz with the sum on the left and
     the answers on the right. */
  @media (min-aspect-ratio:5/4){
    #app{max-width:1180px}
    #screen-home.active{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:32px;align-items:center}
    .home-title{padding-top:0}
    #screen-ninjabelt-quiz.active,#screen-classic-quiz.active{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center;align-content:center}
    .quiz-board .grid-2,.quiz-board .grid-3{gap:14px}
  }
  /* Phones held sideways: about 360px of height. */
  @media (max-height:520px){
    .screen{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:calc(8px + env(safe-area-inset-bottom))}
    .home-title > div:first-child,.home-title > span{display:none !important}
    .home-title{margin-bottom:8px !important}
    .home-title{padding-top:46px}
    #nb-q-text,#cl-q-text{font-size:3rem !important}
    #nb-dots{margin-bottom:8px !important}
    #nb-question,#cl-question{margin-bottom:8px !important}
    .choice-btn{padding:10px 0}
  }
  /* Short portrait phones: the title gives up its spinning star. */
  @media (max-height:740px) and (max-aspect-ratio:5/4){
    .home-title > div:first-child,.home-title > span{display:none !important}
    .home-title{margin-bottom:10px !important}
  }
  /* On a phone the home screen is taller than the window; it scrolls like a
     menu, and the start button stays pinned at the bottom, never out of reach. */
  @media (max-width:520px) and (max-aspect-ratio:5/4), (max-height:520px){
    .cta-dock{position:sticky;bottom:0;z-index:3;margin-bottom:0 !important;padding:12px 0 4px;
      background:linear-gradient(transparent,var(--strip) 40%)}
  }
  /* Phones: the home screen keeps every choice but loses the extras. The mode
     tabs drop their small print, the rank card its column of belt dots (the
     belt strip below shows the same thing) and the rule its wide spacing. */
  @media (max-width:520px), (max-height:520px){
    .mode-tab > div:nth-child(3){display:none}
    .mode-tab{padding:10px 8px}
    #earned-belt-banner > div:last-child{display:none !important}
    #earned-belt-banner{padding:10px 14px !important;margin-bottom:12px !important}
    #rule-reminder div{letter-spacing:0 !important;line-height:1.45 !important}
    #rule-reminder{margin-bottom:12px !important}
    #home-cta{padding:13px 36px !important}
  }
  /* Desktop: desktop-sized type everywhere (the sizes are all in rem). */
  @media (min-aspect-ratio:5/4) and (min-width:1200px) and (min-height:700px){
    html{font-size:19px}
    .choice-btn{padding:22px 0}
  }
  /* hide scrollbar */
  .screen::-webkit-scrollbar{display:none;}
  .screen{scrollbar-width:none;-ms-overflow-style:none;}

  /* Keyframes */
  @keyframes pop{0%{transform:scale(1.2) translate(0,0);opacity:1}100%{transform:scale(0) translate(var(--dx),var(--dy));opacity:0}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
  @keyframes bounceIn{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 20px var(--pink),0 0 40px var(--pink)}50%{box-shadow:0 0 50px var(--pink),0 0 90px var(--pink)}}
  @keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  @keyframes orbGlow{0%,100%{box-shadow:0 0 20px currentColor}50%{box-shadow:0 0 40px currentColor}}
  @keyframes starSpin{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.3)}100%{transform:rotate(360deg) scale(1)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes correctReveal{0%{transform:scale(0.8);opacity:0}40%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
  @keyframes timerPulse{0%,100%{opacity:1}50%{opacity:0.25}}
  @keyframes promotion{0%{transform:scale(0) rotate(-15deg);opacity:0}60%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0deg)}}
  @keyframes flashGreen{0%{background:rgba(124,255,80,0.4);border-color:var(--green);color:var(--green)}100%{background:rgba(var(--fg),0.05);border-color:rgba(var(--fg),0.18);color:rgb(var(--fg))}}
  @keyframes flashRed{0%{background:rgba(255,68,68,0.4);border-color:var(--red);color:var(--red)}100%{background:rgba(var(--fg),0.05);border-color:rgba(var(--fg),0.18);color:rgb(var(--fg))}}
  @keyframes edgePulse{0%{opacity:1}100%{opacity:0}}
  @keyframes shake-anim{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

  /* Buttons */
  .cta-btn{border:none;color:white;font-family:'Courier New',monospace;font-weight:bold;border-radius:50px;cursor:pointer;letter-spacing:3px;transition:transform 0.15s;}
  .cta-btn:hover{transform:scale(1.06);}
  .cta-btn:active{transform:scale(0.97);}
  .choice-btn{font-family:'Courier New',monospace;font-weight:bold;padding:14px 0;border-radius:12px;cursor:pointer;border:2px solid rgba(var(--fg),0.18);background:rgba(var(--fg),0.05);color:rgb(var(--fg));transition:background 0.1s,border-color 0.1s,transform 0.1s;font-size:1.75rem;width:100%;}
  .choice-btn:hover:not(:disabled){background:rgba(var(--fg),0.12);border-color:var(--yellow);color:var(--yellow);}
  .choice-btn:active:not(:disabled){transform:scale(0.96);}
  .choice-btn:disabled{cursor:default;}
  .choice-btn.flash-correct{animation:flashGreen 0.32s ease forwards;}
  .choice-btn.flash-wrong{animation:flashRed 0.32s ease forwards;}
  .pill-btn{font-family:'Courier New',monospace;font-size:0.8125rem;letter-spacing:2px;padding:6px 12px;min-height:42px;min-width:44px;border-radius:8px;cursor:pointer;transition:all 0.15s;border:2px solid rgba(var(--fg),0.14);background:rgba(var(--fg),0.05);color:rgba(var(--fg),calc(0.42*var(--tk) + var(--tb)));}
  .mode-tab{flex:1;padding:14px 10px;border-radius:12px;border:2px solid rgba(var(--fg),0.1);background:rgba(var(--fg),0.04);cursor:pointer;transition:all 0.18s;text-align:center;}
  .mode-tab:hover{border-color:rgba(var(--fg),0.3);transform:scale(1.02);}
  .diff-card{flex:1;padding:9px 5px;border-radius:10px;border:2px solid rgba(var(--fg),0.1);background:rgba(var(--fg),0.04);cursor:pointer;transition:all 0.15s;text-align:center;}
  .name-input{background:rgba(var(--fg),0.08);border:2px solid rgba(var(--fg),0.2);color:rgb(var(--fg));font-family:'Courier New',monospace;font-size:1rem;letter-spacing:3px;padding:9px 14px;border-radius:10px;outline:none;width:140px;text-align:center;text-transform:uppercase;}
  .name-input:focus{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,0.3);}
  .name-input::placeholder{color:rgba(var(--fg),calc(0.2*var(--tk) + var(--tb)));}
  .slabel{color:rgba(var(--fg),calc(0.35*var(--tk) + var(--tb)));font-size:0.8125rem;letter-spacing:3px;margin-bottom:7px;}

  /* Belt strip */
  .belt-strip-wrap{position:relative;margin-bottom:6px;}
  .belt-strip-fade-l{position:absolute;left:0;top:0;bottom:0;width:24px;background:linear-gradient(90deg,var(--strip),transparent);pointer-events:none;z-index:2;}
  .belt-strip-fade-r{position:absolute;right:0;top:0;bottom:0;width:24px;background:linear-gradient(270deg,var(--strip),transparent);pointer-events:none;z-index:2;}
  .belt-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;padding-left:12px;padding-right:12px;scrollbar-width:none;-ms-overflow-style:none;}
  .belt-strip::-webkit-scrollbar{display:none;}
  .belt-item{flex-shrink:0;width:72px;padding:10px 0 8px;border-radius:12px;border:2px solid rgba(var(--fg),0.09);background:rgba(var(--fg),0.03);cursor:pointer;text-align:center;position:relative;transition:all 0.18s;}
  .belt-item.locked{opacity:0.22;cursor:not-allowed;}
  .belt-item .crown{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:0.8125rem;line-height:1;}

  /* grid helpers */
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .flex-row{display:flex;gap:8px;}
  .flex-center{display:flex;justify-content:center;align-items:center;}
  .text-center{text-align:center;}
  .shake{animation:shake-anim 0.5s ease;}

  /* stat card */
  .stat-block{text-align:center;}
  .stat-val{font-size:1.05rem;font-weight:bold;}
  .stat-lbl{color:rgba(var(--fg),calc(0.26*var(--tk) + var(--tb)));font-size:0.8125rem;letter-spacing:1px;margin-top:2px;}
  .divider{width:1px;height:28px;background:rgba(var(--fg),0.1);}
  .lb-row{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border-radius:7px;margin-bottom:3px;}
</style>
</head>
<body>
<div id="scanlines"></div>
<div id="edge-pulse"></div>
<div id="particles-container"></div>

<a id="back-to-games" href="../" title="Back to games">&lsaquo; GAMES</a>

<div id="app">

<!-- ══ HOME ══ -->
<div id="screen-home" class="screen active">
  <div class="home-col">
  <div class="text-center home-title" style="margin-bottom:18px;">
    <div style="font-size:2.6rem;display:inline-block;animation:starSpin 4s linear infinite;">⭐</div>
    <h1 style="color:var(--yellow);font-size:clamp(1.8rem,7vw,2.8rem);margin:4px 0 2px;letter-spacing:4px;text-shadow:0 0 20px var(--yellow),0 0 40px color-mix(in srgb,var(--yellow) 40%,transparent);">TIMES TABLE</h1>
    <h2 style="color:var(--pink);font-size:clamp(1rem,4vw,1.5rem);margin:0 0 4px;letter-spacing:6px;text-shadow:0 0 15px var(--pink);">BLASTER!</h2>
    <span style="color:rgba(var(--fg),calc(0.18*var(--tk) + var(--tb)));font-size:0.8125rem;letter-spacing:3px;">V8</span>
  </div>

  <!-- Mode tabs -->
  <div class="flex-row" style="margin-bottom:20px;">
    <div class="mode-tab" id="tab-ninja" onclick="setGameMode('ninjabelt')">
      <div style="font-size:1.8rem;">🥷</div>
      <div style="color:rgba(var(--fg),calc(0.6*var(--tk) + var(--tb)));font-weight:bold;font-size:0.8125rem;letter-spacing:2px;margin-top:5px;">NINJA BELT</div>
      <div style="color:rgba(var(--fg),calc(0.28*var(--tk) + var(--tb)));font-size:0.8125rem;margin-top:3px;">flash round · 60s · belt up</div>
    </div>
    <div class="mode-tab" id="tab-classic" onclick="setGameMode('classic')">
      <div style="font-size:1.8rem;">🎮</div>
      <div style="color:rgba(var(--fg),calc(0.6*var(--tk) + var(--tb)));font-weight:bold;font-size:0.8125rem;letter-spacing:2px;margin-top:5px;">CLASSIC</div>
      <div style="color:rgba(var(--fg),calc(0.28*var(--tk) + var(--tb)));font-size:0.8125rem;margin-top:3px;">10 Qs · feedback · timer</div>
    </div>
  </div>

  </div>
  <div class="home-col">
  <!-- Ninja Belt Setup -->
  <div id="ninja-setup">
    <!-- Earned belt banner -->
    <div id="earned-belt-banner" style="background:rgba(var(--shade),0.22);border-radius:14px;padding:13px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px;"></div>

    <!-- Q count -->
    <div style="margin-bottom:14px;">
      <div class="slabel">QUESTIONS PER ROUND</div>
      <div class="flex-row" id="qcount-pills"></div>
    </div>

    <div class="slabel">SELECT BELT TO ATTEMPT</div>
    <!-- Belt strip -->
    <div class="belt-strip-wrap">
      <div class="belt-strip-fade-l"></div>
      <div class="belt-strip-fade-r"></div>
      <div class="belt-strip" id="belt-strip"></div>
    </div>

    <!-- PB Card -->
    <div style="margin-bottom:6px;">
      <div class="slabel" id="pb-label" style="margin-bottom:5px;"></div>
      <div id="pb-card"></div>
    </div>

    <!-- Rule reminder -->
    <div id="rule-reminder" style="background:rgba(var(--shade),0.18);border-radius:8px;padding:8px 12px;margin-bottom:18px;margin-top:10px;">
      <div style="color:rgba(var(--fg),calc(0.22*var(--tk) + var(--tb)));font-size:0.8125rem;letter-spacing:1px;line-height:1.7;"></div>
    </div>
  </div>

  <!-- Classic Setup -->
  <div id="classic-setup" style="display:none;">
    <div style="margin-bottom:14px;">
      <div class="slabel">DIFFICULTY</div>
      <div class="flex-row" id="diff-cards"></div>
    </div>
    <div style="margin-bottom:14px;">
      <div class="slabel">FOCUS TABLE</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;" id="focus-pills"></div>
    </div>
    <div style="margin-bottom:14px;">
      <div class="slabel">TIMER (per question)</div>
      <div class="flex-row flex-wrap" id="timer-pills"></div>
    </div>
    <div style="margin-bottom:20px;">
      <div class="slabel">QUESTIONS</div>
      <div class="flex-row" id="repeat-pills"></div>
    </div>
  </div>

  <!-- CTA -->
  <div class="text-center cta-dock" style="margin-bottom:24px;">
    <button class="cta-btn" id="home-cta" style="font-size:1.2rem;padding:15px 44px;"></button>
  </div>

  <!-- Leaderboard -->
  <div id="home-lb" style="margin-bottom:20px;"></div>
  </div>
</div><!-- /home -->

<!-- ══ NINJA BELT QUIZ ══ -->
<div id="screen-ninjabelt-quiz" class="screen">
  <div class="quiz-info">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="quit-btn" type="button" onclick="quitQuiz()" aria-label="Stop and go back">✕</button>
      <div id="nb-orb-hdr"></div>
      <div>
        <div id="nb-belt-name" style="font-size:0.8125rem;letter-spacing:2px;font-weight:bold;"></div>
        <div id="nb-belt-table" style="color:rgba(var(--fg),calc(0.28*var(--tk) + var(--tb)));font-size:0.8125rem;"></div>
      </div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;">
      <span id="nb-score-correct" style="color:var(--green);font-size:0.82rem;"></span>
      <span id="nb-score-wrong" style="color:var(--red);font-size:0.82rem;display:none;"></span>
      <span id="nb-qnum" style="color:rgba(var(--fg),calc(0.25*var(--tk) + var(--tb)));font-size:0.8125rem;"></span>
    </div>
  </div>

  <!-- Timer bar -->
  <div style="background:rgba(var(--fg),0.08);border-radius:4px;height:7px;margin-bottom:6px;overflow:hidden;">
    <div id="nb-timer-bar" style="height:100%;border-radius:4px;background:var(--cyan);transition:width 1s linear,background 0.5s;box-shadow:0 0 10px var(--cyan);width:100%;"></div>
  </div>

  <!-- Progress dots -->
  <div id="nb-dots" style="display:flex;gap:3px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;"></div>

  <!-- Question -->
  <div id="nb-question" class="text-center" style="margin-bottom:20px;">
    <div id="nb-q-text" style="font-size:clamp(2.8rem,14vw,4.8rem);font-weight:bold;color:rgb(var(--fg));letter-spacing:4px;"></div>
    <div style="font-size:1.6rem;color:rgba(var(--fg),calc(0.2*var(--tk) + var(--tb)));letter-spacing:2px;margin-top:4px;">= ?</div>
  </div>

  </div>
  <!-- Choices -->
  <div class="quiz-board">
  <div class="grid-2" id="nb-choices"></div>

  <div class="text-center" style="margin-top:10px;color:rgba(var(--fg),calc(0.16*var(--tk) + var(--tb)));font-size:0.8125rem;letter-spacing:2px;">
    RESULTS SHOWN AT END · PERFECT SCORE = RANK UP
  </div>
  </div>
</div><!-- /ninja quiz -->

<!-- ══ NINJA BELT RESULT ══ -->
<div id="screen-ninjabelt-result" class="screen">
  <div id="nbr-top" class="text-center"></div>

  <!-- Stats -->

<script>
// ── Constants ──────────────────────────────────────────────────────────────────
const NINJA_TOTAL_SECS = 60;
const Q_OPTIONS = [10, 20, 30];

const BELTS = [

  { level:2,  name:"YELLOW",     color:"#FFE600", emoji:"🟡", table:2  },
  { level:3,  name:"ORANGE",     color:"#FF8C00", emoji:"🟠", table:3  },
  { level:4,  name:"GREEN",      color:"#7cff50", emoji:"🟢", table:4  },
  { level:5,  name:"BLUE",       color:"#00e5ff", emoji:"🔵", table:5  },
  { level:6,  name:"PURPLE",     color:"#bf5fff", emoji:"🟣", table:6  },
  { level:7,  name:"RED",        color:"#ff4444", emoji:"🔴", table:7  },
  { level:8,  name:"BROWN",      color:"#c47a3a", emoji:"🟤", table:8  },
  { level:9,  name:"DARK BLUE",  color:"#3a6bff", emoji:"💙", table:9  },
  { level:10, name:"DARK GREEN", color:"#22a83a", emoji:"💚", table:10 },
  { level:11, name:"RED-BLACK",  color:"#dd2211", emoji:"🔺", table:11 },
  { level:12, name:"BLACK",      color:"#cccccc", emoji:"🥷", table:12, blackBelt:true },
];

const DIFFICULTIES = {
  easy:   { label:"EASY",   emoji:"🐢", desc:"Tables ×1–×6",       color:"#7cff50", maxTable:6,  choiceSpread:10, numChoices:4, ptsMult:1.0 },
  medium: { label:"MEDIUM", emoji:"🦊", desc:"Tables ×1–×12",      color:"#ffe600", maxTable:12, choiceSpread:20, numChoices:4, ptsMult:1.5 },
  hard:   { label:"HARD",   emoji:"🦈", desc:"×1–×12 · 6 choices", color:"#ff4da6", maxTable:12, choiceSpread:30, numChoices:6, ptsMult:2.0 },
};

const TIMER_OPTIONS = [{ label:"3s", value:3 }, { label:"5s", value:5 }, { label:"8s", value:8 }];

// ── Theme ──────────────────────────────────────────────────────────────────────
// Colours made here (belts, pills, bars) can't use the stylesheet's variables
// where the script adds an alpha to the hex, so tone() does the same job: in
// the light arcade a bright colour is darkened until it reads on a pale
// background. Darkened colours stay below the threshold, so tone(tone(c)) is
// tone(c).
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function isLight(){
  const t = document.documentElement.dataset.theme;
  return t ? t === 'light' : !darkMQ.matches;
}
function tone(hex){
  if(!isLight() || !/^#[0-9a-f]{6}$/i.test(hex)) return hex;
  const n = parseInt(hex.slice(1),16), rgb = [n>>16&255, n>>8&255, n&255];
  const lum = (0.2126*rgb[0] + 0.7152*rgb[1] + 0.0722*rgb[2]) / 255;
  if(lum < 0.36) return hex;
  return '#' + rgb.map(v=>Math.round(v*0.55).toString(16).padStart(2,'0')).join('');
}
// Names are typed by the player and drawn with innerHTML.
function esc(t){ return String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── Storage ────────────────────────────────────────────────────────────────────
const LB_KEY   = "ttb_lb_v8";
const BELT_KEY = "ttb_belt_v8";
const PB_KEY   = "ttb_pb_v8";

// A damaged save must not stop the home screen drawing.
function getLB()   { try { const v = JSON.parse(localStorage.getItem(LB_KEY) || "[]"); return Array.isArray(v) ? v.filter(e=>e && typeof e.points==="number") : []; } catch { return []; } }
function saveLB(b) { try { localStorage.setItem(LB_KEY,  JSON.stringify(b)); } catch {} }
function getBelt() { try { return Math.max(1, Math.min(12, parseInt(localStorage.getItem(BELT_KEY) || "1"))); } catch { return 1; } }
function saveBeltLS(l) { try { localStorage.setItem(BELT_KEY, String(l)); } catch {} }
function getPBs()  { try { const v = JSON.parse(localStorage.getItem(PB_KEY) || "{}"); return v && typeof v==="object" && !Array.isArray(v) ? v : {}; } catch { return {}; } }
function savePBs(d){ try { localStorage.setItem(PB_KEY, JSON.stringify(d)); } catch {} }

// ── State ──────────────────────────────────────────────────────────────────────
let gameMode     = "ninjabelt";

// Shared quiz
let question     = null;

let streak       = 0;
let bestStreak   = 0;
let points       = 0;
let beltMistakes = 0;
let ninjaHistory = [];
let promoted     = false;
let timedOut     = false;
let ninjaSecsLeft = NINJA_TOTAL_SECS;
let ninjaRunning = false;
let activeBelt   = null;
let beltQs       = [];
let beltQIdx     = 0;
let processing   = false;
let flashResult  = null;
let qKey         = 0;
let pool         = [];
let poolIdx      = 0;
let feedback     = null;
let selChoice    = null;
let classicMessage = "";

// Timers

let ninjaTimerID   = null;

let flashTimerID   = null;

// ── Helpers ────────────────────────────────────────────────────────────────────
function buildBeltQuestions(tableNum, count) {
  const base = Array.from({length:12},(_,i)=>({a:tableNum,b:i+1,answer:tableNum*(i+1)}));
  const qs = [];
  while(qs.length < count) qs.push(...[...base].sort(()=>Math.random()-0.5));
  return qs.slice(0, count);
}

function randomQ(focTable, maxTable) {
  const a = focTable || Math.floor(Math.random()*maxTable)+1;
  const b = Math.floor(Math.random()*maxTable)+1;
  return {a,b,answer:a*b};
}

function buildPool(focTable, maxTable) {
  const p = [];
  const aVals = focTable ? [focTable] : Array.from({length:maxTable},(_,i)=>i+1);
  for(const a of aVals) for(let b=1;b<=maxTable;b++) p.push({a,b,answer:a*b});
  for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];}
  return p;
}

function generateChoices(correct, spread, numChoices) {
  const s = new Set([correct]);
  let att = 0;
  while(s.size < numChoices && att < 300){
    att++;
    const w = correct + Math.floor(Math.random()*spread) - Math.floor(spread/2);
    if(w>0 && w!==correct) s.add(w);
  }
  let f=1;
  while(s.size < numChoices){if(f!==correct)s.add(f);f++;}
  return [...s].sort(()=>Math.random()-0.5);
}

function calcClassicPts({correct,diff,timerMd,timerS,noRep,bStreak}){
  const d = DIFFICULTIES[diff];
  return Math.round(correct*100*d.ptsMult*(timerMd?(timerS<=3?2.0:timerS<=5?1.5:1.2):1.0)*(noRep?1.2:1.0)*(1+bStreak*0.05));
}

function calcNinjaBeltPts({correct,total,secsLeft,beltLevel,bStreak}){
  const beltMult   = 1+(beltLevel-1)*0.15;
  const countBonus = total===30?1.5:total===20?1.25:1.0;
  const speedBonus = 1+(secsLeft/NINJA_TOTAL_SECS)*0.6;
  const streakBonus= 1+bStreak*0.05;
  return Math.round(correct*60*beltMult*countBonus*speedBonus*streakBonus);
}

function vibrate(p){ if(navigator.vibrate) navigator.vibrate(p); }

function getDiff(){ return DIFFICULTIES[difficulty]; }

// ── DOM helpers ────────────────────────────────────────────────────────────────
function el(id){ return document.getElementById(id); }

function showScreen(name){
  document.body.dataset.screen = name;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const s = el('screen-'+name);
  if(s){ s.classList.add('active'); s.scrollTop=0; }
  if(name === 'home') renderHome();
}

// ── Particles ──────────────────────────────────────────────────────────────────
function spawnParticles(colors){
  colors = colors || [tone("#ff4da6"),tone("#ffe600"),tone("#00e5ff"),tone("#7cff50"),tone("#ff6b35"),tone("#bf5fff")];
  const container = el('particles-container');
  const frags = [];
  for(let i=0;i<20;i++){
    const d = document.createElement('div');
    d.className='particle';
    const dx = (Math.random()-0.5)*140;
    const dy = -(Math.random()*120+40);
    const c  = colors[Math.floor(Math.random()*colors.length)];
    d.style.cssText = `left:${window.innerWidth/2+(Math.random()-0.5)*340}px;top:${window.innerHeight/2+(Math.random()-0.5)*200}px;background:${c};--dx:${dx}px;--dy:${dy}px;`;
    container.appendChild(d);
    frags.push(d);
  }
  setTimeout(()=>frags.forEach(d=>d.remove()), 950);
}

// ── Edge pulse ─────────────────────────────────────────────────────────────────
function triggerEdgePulse(type){
  const ep = el('edge-pulse');
  ep.className = type;
  clearTimeout(edgePulseTimerID);
  edgePulseTimerID = setTimeout(()=>ep.className='', 360);
}

// ── Personal best ──────────────────────────────────────────────────────────────
function maybeUpdatePB(beltLevel, secsLeft, correct, total, qCount){
  const accuracy = Math.round((correct/total)*100);
  const existing = personalBests[beltLevel];
  const isBetter = !existing || accuracy>existing.accuracy || (accuracy===existing.accuracy && secsLeft>existing.secsLeft);
  if(isBetter){
    personalBests = {...personalBests, [beltLevel]:{accuracy,secsLeft,qCount,date:new Date().toLocaleDateString()}};
    savePBs(personalBests);
    return true;
  }
  return false;
}

// ── Belt Orb HTML ──────────────────────────────────────────────────────────────
function beltOrbHTML(belt, size=44, glow=false, dimmed=false, pulse=false){
  const bg = belt.blackBelt
    ? "radial-gradient(circle at 35% 35%,#2a2a2a,#050505)"
    : `radial-gradient(circle at 35% 35%,${tone(belt.color)}ee,${tone(belt.color)}55)`;
  const boxShadow = glow
    ? `0 0 20px ${tone(belt.color)}99,0 0 40px ${tone(belt.color)}44`
    : `0 0 6px ${tone(belt.color)}33`;
  const border = belt.blackBelt ? "#555" : belt.color;
  const anim = pulse?"orbPulse 2s ease-in-out infinite":glow?"orbGlow 2s ease-in-out infinite":"none";
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;flex-shrink:0;background:${bg};border:${size>55?3:2}px solid ${border};box-shadow:${boxShadow};display:flex;align-items:center;justify-content:center;opacity:${dimmed?0.35:1};animation:${anim};transition:all 0.3s;">
    <span style="font-size:${size*0.38}px;line-height:1;">${belt.emoji}</span>
  </div>`;
}

// ── PB Card HTML ───────────────────────────────────────────────────────────────
function pbCardHTML(beltLevel){

  if(!pb) return `<div style="background:rgba(var(--shade),0.18);border-radius:8px;padding:8px 12px;color:rgba(var(--fg),calc(0.18*var(--tk) + var(--tb)));font-size:0.8125rem;letter-spacing:2px;text-align:center;">NO PERSONAL BEST YET FOR THIS BELT</div>`;
  return `<div style="background:rgba(var(--shade),0.22);border:1px solid ${tone(belt.color)}33;border-radius:8px;padding:8px 14px;display:flex;gap:16px;align-items:center;justify-content:center;">

    <div class="divider"></div>

// ── Pill HTML ──────────────────────────────────────────────────────────────────
function pillHTML(label, active, color, onclick, extraStyle=''){

}

// ── Leaderboard HTML ───────────────────────────────────────────────────────────
function lbHTML(limit=7){

        <div><span style="color:var(--yellow);font-size:0.8125rem;font-weight:bold;">${e.points.toLocaleString()}</span><span style="color:rgba(var(--fg),calc(0.26*var(--tk) + var(--tb)));font-size:0.8125rem;margin-left:6px;">${esc(e.mode)}</span></div>
      </div>`).join('');
}

function renderHome(){
  // Mode tabs styling
  const nt = el('tab-ninja'), ct = el('tab-classic');
  if(gameMode==='ninjabelt'){
    nt.style.borderColor=tone('#00e5ff'); nt.style.background='rgba(0,229,255,0.08)'; nt.style.boxShadow='0 0 16px rgba(0,229,255,0.2)';

  } else {
    ct.style.borderColor=tone('#ff4da6'); ct.style.background='rgba(255,77,166,0.08)'; ct.style.boxShadow='0 0 16px rgba(255,77,166,0.2)';

    nt.style.borderColor='rgba(var(--fg),0.1)'; nt.style.background='rgba(var(--fg),0.04)'; nt.style.boxShadow='none';

  }

  if(gameMode==='ninjabelt'){

  if(gameMode==='ninjabelt'){
    const pbd = BELTS[attemptBelt-1];
    const nbd = BELTS[Math.min(11,earnedBelt)];
    cta.style.background = `linear-gradient(135deg,${tone(pbd.color)},${tone(nbd.color)})`;
    cta.style.animation  = 'orbPulse 2s ease-in-out infinite';
    cta.style.color      = pbd.level===1&&!isLight()?'#1a1a2e':'white';

function startNinjaBelt(beltLevel, qCount){
  clearInterval(ninjaTimerID);
  clearTimeout(flashTimerID);
  const belt = BELTS[beltLevel-1];
  beltQs        = buildBeltQuestions(belt.table, qCount);
  beltQIdx      = 0;
  processing    = false;
  score=0;streak=0;bestStreak=0;beltMistakes=0;points=0;
  promoted=false;timedOut=false;
  flashResult=null;qKey=0;
  ninjaHistory  = [];
  ninjaSecsLeft = NINJA_TOTAL_SECS;
  activeBelt    = belt;
  savedScore    = null;
  nameInput     = "";

  const q = beltQs[0];
  question = q;
  choices  = generateChoices(q.answer,20,4);
  questionNum = 1;

  renderNinjaQuiz();
  showScreen('ninjabelt-quiz');
  setTimeout(()=>{ ninjaRunning=true; startNinjaTimer(); }, 80);
}

function startNinjaTimer(){
  clearInterval(ninjaTimerID);
  ninjaTimerID = setInterval(()=>{
    ninjaSecsLeft--;
    updateNinjaTimerBar();
    if(ninjaSecsLeft<=0){
      clearInterval(ninjaTimerID);
      ninjaRunning=false;
      endNinjaBelt(true);
    }
  },1000);
}

function updateNinjaTimerBar(){
  const bar = el('nb-timer-bar');
  if(!bar) return;
  const pct = (ninjaSecsLeft/NINJA_TOTAL_SECS)*100;
  const color = ninjaSecsLeft>30?tone("#00e5ff"):ninjaSecsLeft>15?tone("#ffe600"):tone("#ff4444");
  bar.style.width  = pct+'%';
  bar.style.background = color;
  bar.style.boxShadow  = `0 0 10px ${tone(color)}`;
  bar.style.animation  = ninjaSecsLeft<=10?"timerPulse 0.5s ease-in-out infinite":"none";
}

function renderNinjaQuiz(){
  const b = activeBelt;
  el('nb-orb-hdr').innerHTML = beltOrbHTML(b,36,true);
  el('nb-belt-name').style.color = tone(b.color);
  el('nb-belt-name').textContent = b.name+' BELT';
  el('nb-belt-table').textContent = '×'+b.table+' table';
  updateNinjaQuizUI();
}

function updateNinjaQuizUI(){
  const b = activeBelt;
  el('nb-score-correct').textContent = '✓ '+score;
  const wrongEl = el('nb-score-wrong');
  if(beltMistakes>0){ wrongEl.style.display=''; wrongEl.textContent='✗ '+beltMistakes; } else { wrongEl.style.display='none'; }
  el('nb-qnum').textContent = questionNum+'/'+beltQs.length;

  // Dots
  el('nb-dots').innerHTML = beltQs.map((_,i)=>{
    const h=ninjaHistory[i]; const done=i<ninjaHistory.length; const cur=i===questionNum-1;
    return `<div style="width:10px;height:10px;border-radius:50%;background:${done?(h.correct?tone("#7cff50"):tone("#ff4444")):cur?b.color:"rgba(var(--fg),0.12)"};box-shadow:${cur?`0 0 7px ${tone(b.color)}`:"none"};transition:background 0.15s;"></div>`;
  }).join('');

  // Question
  el('nb-q-text').textContent = question.a+' × '+question.b;
  el('nb-q-text').style.textShadow = `0 0 28px ${tone(b.color)}55`;

  // Choices
  renderNinjaChoices();
}

function renderNinjaChoices(){
  el('nb-choices').innerHTML = choices.map(c=>`
    <button class="choice-btn" onclick="handleNinjaChoice(${c})">${c}</button>
  `).join('');
}

function handleNinjaChoice(choice){
  if(!ninjaRunning || processing) return;
  processing = true;

  const correct = choice === question.answer;
  ninjaHistory.push({q:question, selected:choice, correct});

  if(correct){
    const ns = streak+1; streak=ns;
    if(ns>bestStreak) bestStreak=ns;
    score++;
    vibrate(25);
  } else {
    streak=0; beltMistakes++;
    vibrate([60,30,80]);
  }

  triggerEdgePulse(correct?'correct':'wrong');

  // Flash the chosen button
  const btns = el('nb-choices').querySelectorAll('.choice-btn');
  btns.forEach(btn=>{
    if(parseInt(btn.textContent)===choice){
      btn.classList.add(correct?'flash-correct':'flash-wrong');
    }
    btn.disabled=true;
  });
  updateNinjaQuizUI();

  clearTimeout(flashTimerID);
  flashTimerID = setTimeout(()=>{
    const nextIdx = beltQIdx+1;
    if(nextIdx >= beltQs.length){
      processing=false;
      ninjaRunning=false;
      clearInterval(ninjaTimerID);
      endNinjaBelt(false);
      return;
    }
    beltQIdx=nextIdx; qKey=nextIdx;
    const q = beltQs[nextIdx];
    question = q;
    choices  = generateChoices(q.answer,20,4);
    questionNum = nextIdx+1;
    processing=false;
    updateNinjaQuizUI();
  },220);
}

function endNinjaBelt(didTimeout){
  clearInterval(ninjaTimerID);
  clearTimeout(flashTimerID);
  const sl    = ninjaSecsLeft;
  const belt  = activeBelt;
  const total = beltQs.length;
  const perfect = beltMistakes===0 && score===total;

  points = calcNinjaBeltPts({correct:score,total,secsLeft:sl,beltLevel:belt.level,bStreak:bestStreak});
  timedOut = didTimeout;

  if(!didTimeout) maybeUpdatePB(belt.level, sl, score, total, total);

  if(perfect && !didTimeout && belt.level<12 && belt.level>=earnedBelt){
    const newLevel = belt.level+1;
    earnedBelt = newLevel;
    saveBeltLS(newLevel);
    promoted = true;
    spawnParticles([belt.color, BELTS[belt.level].color, tone("#ffe600"),"#fff"]);
  } else if(perfect && !didTimeout && belt.level===12){
    promoted=true;
    spawnParticles([tone("#ffe600"),"#fff","#ccc","#888"]);
  } else {
    promoted=false;
  }

  renderNinjaResult();
  showScreen('ninjabelt-result');
}

  const qDiv = el('cl-question');
  qDiv.classList.add('shake');
  setTimeout(()=>qDiv.classList.remove('shake'),500);
  showClassicFeedback();
  classicAdvance(1300);
}

function renderClassicChoices(){
  const d = getDiff();
  el('cl-choices').className = d.numChoices===6?'grid-3':'grid-2';
  el('cl-choices').innerHTML = choices.map(c=>`<button class="choice-btn" onclick="handleClassicChoice(${c})" style="font-size:${d.numChoices===6?"1.4rem":"1.75rem"};">${c}</button>`).join('');
}

function handleClassicChoice(choice){
  if(feedback) return;
  clearInterval(classicTimerID);
  selChoice=choice;
  const correct = choice===question.answer;
  if(correct){
    const ns=streak+1; streak=ns;
    if(ns>bestStreak) bestStreak=ns;
    score++;
    feedback='correct';
    classicMessage=["PERFECT!","GENIUS!","NAILED IT!","AMAZING!"][Math.floor(Math.random()*4)];
    triggerEdgePulse('correct');
    spawnParticles(); vibrate(50);
    classicAdvance(2200);
  } else {
    streak=0;
    feedback='wrong';
    classicMessage=["Almost!","Keep going!","So close!"][Math.floor(Math.random()*3)];
    triggerEdgePulse('wrong');
    vibrate([100,50,100,50,150]);
    const qDiv = el('cl-question');
    qDiv.classList.add('shake');
    setTimeout(()=>qDiv.classList.remove('shake'),500);
    classicAdvance(1300);
  }
  showClassicFeedback();
  el('cl-score').textContent  = '⭐'+score;
  el('cl-streak').textContent = '🔥'+streak;
}

function showClassicFeedback(){
  const d = getDiff();
  const msg = el('cl-message');
  if(feedback==='correct'){
    msg.textContent=classicMessage; msg.style.color=tone('#7cff50');
    const ans=el('cl-q-answer'); ans.textContent=`= ${question.answer} ✓`; ans.style.color=tone('#7cff50'); ans.style.textShadow='0 0 20px var(--green)'; ans.style.animation='correctReveal 0.4s ease';
  } else {
    msg.textContent=classicMessage; msg.style.color=tone('#ff5555');
    const ans=el('cl-q-answer'); ans.textContent=`= ${question.answer}`; ans.style.color='rgba(var(--fg),calc(0.38*var(--tk) + var(--tb)))'; ans.style.animation='';
  }
  // Color choice buttons
  el('cl-choices').querySelectorAll('.choice-btn').forEach(btn=>{
    const c=parseInt(btn.textContent);
    if(c===question.answer){ btn.style.borderColor=tone('#7cff50');btn.style.background='rgba(124,255,80,0.15)';btn.style.color=tone('#7cff50'); }
    else if(c===selChoice){ btn.style.borderColor=tone('#ff4444');btn.style.background='rgba(255,68,68,0.12)';btn.style.color=tone('#ff5555'); }
    btn.disabled=true;
  });
}

function classicAdvance(delay){
  clearTimeout(advanceID);
  advanceID = setTimeout(()=>{
    questionNum++;
    if(questionNum>10){
      const d=getDiff();
      points=calcClassicPts({correct:score,diff:difficulty,timerMd:timerMode,timerS:timerSecs,noRep:noRepeat,bStreak:bestStreak});
      renderClassicResult();
      showScreen('classic-result');
      return;
    }
    const d=getDiff();
    if(noRepeat){
      if(poolIdx>=pool.length){ pool=buildPool(focusTable,d.maxTable); poolIdx=0; }
      question=pool[poolIdx++];
    } else { question=randomQ(focusTable,d.maxTable); }
    choices=generateChoices(question.answer,d.choiceSpread,d.numChoices);
    feedback=null; selChoice=null; timeLeft=timerSecs;
    renderClassicQuiz();
  },delay);
}

function renderClassicResult(){
  const d=getDiff();
  const titles=score===10?"MASTER!":score>=7?"GREAT JOB!":score>=4?"GOOD TRY!":"KEEP GOING!";
  el('clr-title').textContent=titles;
  const stars=score===10?3:score>=7?2:score>=4?1:0;
  el('clr-stars').innerHTML=[0,1,2].map(i=>`<span style="opacity:${i<stars?1:0.14};filter:${i<stars?"drop-shadow(0 0 10px var(--yellow))":"none"};animation:${i<stars?`starSpin ${1.5+i*0.3}s linear infinite`:"none"};display:inline-block;margin:0 4px;">⭐</span>`).join('');
  el('clr-points').textContent=points.toLocaleString();
  el('clr-score-big').innerHTML=`${score}<span style="font-size:1.2rem;color:rgba(var(--fg),calc(0.32*var(--tk) + var(--tb)));">/10</span>`;
  const statsData=[
    {val:`🔥 ${bestStreak}`,label:"STREAK",color:tone("#ff4da6")},
    {val:`${Math.round(score/10*100)}%`,label:"ACCURACY",color:tone("#00e5ff")},
    {val:d.emoji,label:d.label,color:d.color},
    {val:timerMode?`⏱${timerSecs}s`:"FREE",label:"TIMER",color:"rgba(var(--fg),0.4)"},
  ];
  el('clr-stats').innerHTML=statsData.map(s=>`<div class="stat-block"><div class="stat-val" style="color:${tone(s.color)};">${s.val}</div><div class="stat-lbl">${s.label}</div></div>`).join('');
  renderClrSave();
  renderClrLB();
}

function renderClrSave(){
  if(!savedScore){
    el('clr-save').innerHTML=`<div style="color:rgba(var(--fg),calc(0.26*var(--tk) + var(--tb)));font-size:0.8125rem;letter-spacing:2px;margin-bottom:7px;">SAVE TO LEADERBOARD</div>
      <div style="display:flex;gap:8px;justify-content:center;align-items:center;">
        <input class="name-input" id="clr-name-input" placeholder="YOUR NAME" maxlength="12" oninput="nameInput=this.value" onkeydown="if(event.key==='Enter')saveToLBClassic()"/>
        <button onclick="saveToLBClassic()" style="background:linear-gradient(135deg,var(--cyan),var(--purple));border:none;color:white;font-family:'Courier New',monospace;font-weight:bold;font-size:0.8125rem;letter-spacing:2px;padding:11px 14px;border-radius:10px;cursor:pointer;">SAVE</button>
      </div>`;
  } else {
    el('clr-save').innerHTML=`<div style="color:var(--green);font-size:0.8125rem;letter-spacing:2px;">✓ SAVED AS ${esc(savedScore.name)}!</div>`;
  }
}

function renderClrLB(){
  if(!leaderboard.length){ el('clr-lb').innerHTML=''; return; }
  el('clr-lb').innerHTML=`<div style="color:var(--pink);font-size:0.8125rem;letter-spacing:4px;margin-bottom:7px;text-align:center;">🏆 TOP SCORES</div>`
    +leaderboard.slice(0,5).map((e,i)=>`<div class="lb-row" style="background:${i===0?"rgba(255,230,0,0.09)":"rgba(var(--fg),0.04)"};border:1px solid ${i===0?"rgba(255,230,0,0.22)":"rgba(var(--fg),0.07)"};">
      <span style="color:${i===0?tone("#ffe600"):"rgba(var(--fg),0.38)"};font-size:0.8125rem;">${i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}.`} ${esc(e.name)}</span>
      <div><span style="color:var(--yellow);font-size:0.8125rem;font-weight:bold;">${e.points.toLocaleString()}</span><span style="color:rgba(var(--fg),calc(0.24*var(--tk) + var(--tb)));font-size:0.8125rem;margin-left:6px;">${esc(e.mode)}</span></div>
    </div>`).join('');
}

function saveToLBClassic(){
  const nm=(el('clr-name-input')?.value||nameInput).trim();
  if(!nm) return;
  const d=getDiff();
  const tag=[focusTable?`×${focusTable}`:"ALL",d.label,timerMode?`⏱${timerSecs}s`:"",noRepeat?"NR":""].filter(Boolean).join(" ");
  const entry={name:nm.slice(0,12).toUpperCase(),points,score,mode:tag,date:new Date().toLocaleDateString()};
  leaderboard=[entry,...leaderboard].sort((a,b)=>b.points-a.points).slice(0,10);
  saveLB(leaderboard); savedScore=entry;
  renderClrSave();
  renderClrLB();
}

// ── Init ───────────────────────────────────────────────────────────────────────
document.body.dataset.screen = 'home';
renderHome();
// The script's colours were worked out for one theme; redraw when it changes.
darkMQ.addEventListener('change', ()=>{ if(document.body.dataset.screen==='home') renderHome(); });

// ── Service Worker Registration ────────────────────────────────────────────────
// Game Box uses a single service worker at the site root (../sw.js).
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('../sw.js')
      .then(reg=>console.log('SW registered:',reg.scope))
      .catch(err=>console.log('SW failed:',err));
  });
}
</script>
